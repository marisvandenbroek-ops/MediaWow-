<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lilou Opening</title>
<meta name="description" content="Uitnodiging voor de opening van Lilou, c'est tout. — zondag 29 november, 14:00–19:00, Het Pomphuis Ede.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="3d/page.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
  <canvas id="gl" aria-label="Uitnodiging voor de opening van Lilou op zondag 29 november, 14:00 tot 19:00 uur, Het Pomphuis, Klinkenbergerweg 41, Ede. Meld je aan via lilou-ede.nl/opening."></canvas>
  <div class="vignette"></div>
  <div class="grain"></div>
  <div class="loader">Lilou</div>
  <div class="controls">
    <button type="button" id="flipBtn">Draai</button>
    <button type="button" id="replayBtn">Opnieuw</button>
  </div>

<script type="module">
import { createStage, printSheet, sheetMaterial, plainPaper, makeCard, rig, runner, THREE } from './3d/engine.js';

const SERIF = '"Cormorant Garamond"', SANS = 'Inter';
const stage = await createStage({
  canvas: document.getElementById('gl'),
  fonts: [`300 80px ${SERIF}`, `500 80px ${SERIF}`, `600 80px ${SERIF}`, `italic 400 80px ${SERIF}`, `italic 500 80px ${SERIF}`, `600 40px ${SANS}`, `500 40px ${SANS}`]
});
const { scene, aniso } = stage;

/* ---------- Kaart: 130 x 170 mm, roest, crème inkt, goudfolie, blind reliëf ---------- */
const CREAM = '#f3e3d4', RUST = '#7c2513';
const front = printSheet({ wmm: 130, hmm: 170, base: RUST, seed: 4, draw: p => {
  p.arc(100.5, 146, 51, 0, Math.PI * 2, { kind: 'blind', width: .5 });
  p.arc(94, 154, 56, Math.PI * .9, Math.PI * 1.9, { color: 'rgba(243,214,196,.35)', width: .22 });
  p.text('UITNODIGING', 65, 23, { font: SANS, size: 3, weight: 600, spacing: .4, color: CREAM });
  p.text('Lilou', 65, 69, { font: SERIF, size: 50, weight: 300, color: CREAM });
  p.text('c’est tout.', 65, 81, { font: SERIF, size: 9, weight: 600, spacing: .12, color: CREAM });
  p.text('by MARK MINKMAN', 65, 86.5, { font: SANS, size: 2.2, weight: 600, spacing: .2, color: CREAM });
  p.line(57.5, 97, 72.5, 97, { color: CREAM, width: .25 });
  p.text('OPENING', 65, 112, { font: SERIF, size: 12, weight: 600, spacing: .2, kind: 'foil' });
  p.text('zondag 29 november', 65, 123.5, { font: SERIF, size: 8.6, style: 'italic', weight: 400, color: CREAM });
  p.text('14:00 – 19:00 · BORREL & HAPJES', 65, 132, { font: SANS, size: 3.3, weight: 600, spacing: .14, color: CREAM });
  p.text('HET POMPHUIS · KLINKENBERGERWEG 41 · EDE', 65, 151, { font: SANS, size: 3.15, weight: 600, spacing: .1, color: CREAM });
  p.text('MELD JE AAN · LILOU-EDE.NL/OPENING', 65, 157.5, { font: SANS, size: 3.15, weight: 600, spacing: .1, color: CREAM });
}});
const back = printSheet({ wmm: 130, hmm: 170, base: RUST, seed: 8, draw: p => {
  p.text('L', 104, 192, { font: SERIF, size: 150, weight: 300, kind: 'blind', depth: .9 });
  p.rect(6, 6, 118, 158, { color: 'rgba(243,214,196,.4)', width: .2 });
  p.text('DE OPENING', 65, 38, { font: SANS, size: 3, weight: 600, spacing: .4, color: CREAM });
  p.text('29 november', 65, 59, { font: SERIF, size: 15, weight: 500, kind: 'foil' });
  p.text('zondag · 14:00 – 19:00', 65, 71, { font: SERIF, size: 8.4, style: 'italic', color: CREAM });
  p.text('HET POMPHUIS', 65, 86, { font: SANS, size: 3.3, weight: 600, spacing: .26, color: CREAM });
  p.text('KLINKENBERGERWEG 41 · EDE', 65, 92, { font: SANS, size: 2.9, weight: 500, spacing: .14, color: 'rgba(243,214,196,.8)' });
  p.line(57.5, 101, 72.5, 101, { color: CREAM, width: .25 });
  p.text('Borrel & hapjes · gratis', 65, 115, { font: SERIF, size: 7.6, style: 'italic', color: CREAM });
  p.text('MELD JE AAN', 65, 130, { font: SANS, size: 3.6, weight: 600, spacing: .24, kind: 'foil' });
  p.text('LILOU-EDE.NL/OPENING', 65, 137, { font: SANS, size: 3.3, weight: 600, spacing: .12, color: CREAM });
  p.text('VANAF 2 DECEMBER GEOPEND', 65, 147, { font: SANS, size: 2.6, weight: 600, spacing: .22, color: 'rgba(243,214,196,.72)' });
}});
const card = makeCard(stage, { wmm: 130, hmm: 170, front: sheetMaterial(front, aniso), back: sheetMaterial(back, aniso, { flip: true }), edge: '#5e1a0c' });

/* ---------- Envelop 145 x 190 mm met lakzegel ---------- */
const EW = .145, EH = .19, FD = .085;
const paper = plainPaper({ color: '#d9ccb8', seed: 12, aniso });
const inner = plainPaper({ color: '#b9a891', seed: 13, aniso });
const env = new THREE.Group(); scene.add(env);
const V = ([x, y]) => new THREE.Vector2(x, y);
const backP = new THREE.Mesh(new THREE.PlaneGeometry(EW, EH), inner); backP.rotation.x = -Math.PI / 2; backP.position.y = .0002; backP.receiveShadow = true;
const pocket = new THREE.Mesh(new THREE.ShapeGeometry(new THREE.Shape([[-EW / 2, -EH / 2], [EW / 2, -EH / 2], [EW / 2, EH / 2], [0, EH / 2 - .07], [-EW / 2, EH / 2]].map(V))), paper);
pocket.rotation.x = -Math.PI / 2; pocket.position.y = .0012; pocket.castShadow = pocket.receiveShadow = true;
const fold = new THREE.Mesh(new THREE.ShapeGeometry(new THREE.Shape([[-EW / 2, -EH / 2], [EW / 2, -EH / 2], [0, -EH / 2 + .09]].map(V))), paper);
fold.rotation.x = -Math.PI / 2; fold.position.y = .00135; fold.castShadow = fold.receiveShadow = true;
const flapPivot = new THREE.Group(); flapPivot.position.set(0, .0015, -EH / 2);
const flap = new THREE.Mesh(new THREE.ShapeGeometry(new THREE.Shape([[-EW / 2, 0], [EW / 2, 0], [0, -FD]].map(V))), paper);
flap.rotation.x = -Math.PI / 2; flap.castShadow = flap.receiveShadow = true; flapPivot.add(flap);
// lakzegel
const sealSheet = printSheet({ wmm: 34, hmm: 34, ppm: 16, base: '#5e1109', seed: 3, draw: p => {
  p.arc(17, 17, 13, 0, Math.PI * 2, { kind: 'blind', width: .7 });
  p.arc(17, 17, 15.5, 0, Math.PI * 2, { kind: 'blind', width: 1.4 });
  p.text('L', 17, 23.5, { font: SERIF, size: 19, weight: 500, kind: 'blind', depth: 2 });
}});
const sealTop = sheetMaterial(sealSheet, aniso, { normalScale: 1.6 });
sealTop.roughnessMap = null; sealTop.metalnessMap = null; sealTop.roughness = .32; sealTop.metalness = 0; sealTop.envMapIntensity = 1;
const sealSide = new THREE.MeshStandardMaterial({ color: '#4d0d07', roughness: .4 });
const seal = new THREE.Mesh(new THREE.CylinderGeometry(.017, .0175, .0028, 48), [sealSide, sealTop, sealSide]);
seal.position.set(0, .0029, -EH / 2 + FD - .013); seal.castShadow = true; seal.receiveShadow = true;
env.add(backP, pocket, fold, flapPivot, seal);
env.rotation.y = .12; // = ENV_A
env.add(card.pivot); // kaart beweegt in envelop-coördinaten
{ // goudconfetti op tafel
  const n = 140, geo = new THREE.BoxGeometry(.004, .00008, .0022);
  const mat = new THREE.MeshStandardMaterial({ color: '#d7a95e', metalness: 1, roughness: .28, envMapIntensity: 1.2 });
  const im = new THREE.InstancedMesh(geo, mat, n); im.castShadow = true; im.receiveShadow = true;
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), sc = new THREE.Vector3(), ps = new THREE.Vector3();
  let sd = 31; const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < n; i++) {
    let x, z; do { x = (rnd() - .5) * .62; z = (rnd() - .5) * .62 - .06; } while (Math.abs(x) < .085 && z > -.215 && z < .11);
    e.set((rnd() - .5) * .35, rnd() * Math.PI, (rnd() - .5) * .35); q.setFromEuler(e);
    const k = .6 + rnd() * .8; sc.set(k, 1, k); ps.set(x, .0003, z);
    im.setMatrixAt(i, m4.compose(ps, q, sc));
  }
  scene.add(im);
}

/* ---------- Tijdlijn ---------- */
const R = rig(stage);
const C = { x: 0, y: .0007, z: .008, ry: 0, rz: 0 };
const F = { a: 0 };
const ENV_A = .12, FW = { x: .075, z: -.15 };           // eindpositie kaart (wereld)
const FINAL = { x: FW.x * Math.cos(ENV_A) - FW.z * Math.sin(ENV_A), y: .0036, z: FW.x * Math.sin(ENV_A) + FW.z * Math.cos(ENV_A), ry: -.07 - ENV_A };
function topDown() {
  const d = stage.fitDistance(card.w, card.h, stage.STORY ? .9 : .92, stage.STORY ? .7 : .88);
  return { px: FW.x, py: d, pz: FW.z + d * .012, tx: FW.x, ty: FINAL.y, tz: FW.z };
}

Object.assign(R.cam, { px: .2, py: .13, pz: .52, tx: 0, ty: 0, tz: -.03 });
const tl = gsap.timeline({ paused: true, defaults: { ease: 'power2.inOut' } });
tl.to(R.cam, { px: .12, py: .16, pz: .44, duration: 3.4, ease: 'sine.inOut' }, 0)
  .to(F, { a: -Math.PI + .004, duration: 1.7, ease: 'power2.inOut' }, 2.4)
  .to(R.cam, { px: .07, py: .52, pz: .26, tz: -.1, duration: 3.2 }, 3.4)
  .to(C, { z: -.165, duration: 2, ease: 'power2.inOut' }, 4.0)
  .to(C, { y: .025, duration: .7, ease: 'power2.out' }, 6.0)
  .to(C, { x: FINAL.x, z: FINAL.z, ry: FINAL.ry, duration: 1.6, ease: 'power2.inOut' }, 6.0)
  .to(C, { y: FINAL.y, duration: .9, ease: 'power2.in' }, 6.7)
  .to(R.cam, { ...topDown(), duration: 2.6, ease: 'power2.inOut' }, 6.4)
  .to(R.light, { x: -.34, y: .5, z: -.62, tx: FW.x, tz: FW.z, duration: 3.5, ease: 'sine.inOut' }, 6.4)
  .to(R.light, { x: -.48, z: -.34, duration: 2.4, ease: 'sine.inOut' }, 9.9);

function flipTo(target, at, t) {
  t.to(C, { rz: target, duration: 1.5, ease: 'power3.inOut' }, at)
   .to(C, { y: .05, duration: .75, ease: 'power2.out' }, at)
   .to(C, { y: FINAL.y, duration: .75, ease: 'power2.in' }, at + .75);
}

runner(stage, { build: () => ({
  tl,
  apply(t) {
    R.apply(t);
    card.pivot.position.set(C.x, C.y, C.z);
    card.pivot.rotation.set(0, C.ry, C.rz);
    flapPivot.rotation.x = F.a;
  },
  videoTimeline() {
    const m = gsap.timeline({ paused: true });
    m.add(tl.paused(false), 0);
    flipTo(Math.PI, 13.4, m); flipTo(Math.PI * 2, 19, m);
    m.to({}, { duration: .01 }, 23.5);
    return m;
  },
  flip() { const m = gsap.timeline(); flipTo(Math.round(C.rz / Math.PI) * Math.PI + Math.PI, 0, m); },
  reset() { location.reload(); },
  onResize() { Object.assign(R.cam, topDown()); },
  pointer(x, y, done) { if (done) gsap.to(R.light, { x: -.42 + x * .3, z: -.45 + y * .25, duration: 1.2, overwrite: true }); }
}) });
</script>
</body>
</html>
