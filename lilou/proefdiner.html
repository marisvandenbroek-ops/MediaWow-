<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lilou Proefdiner</title>
<meta name="description" content="Uitnodiging voor de avant-première van Lilou — het eerste diner in Het Pomphuis, 26 & 27 november.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="3d/page.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
  <canvas id="gl" aria-label="Uitnodiging voor de avant-première van Lilou: het eerste diner in Het Pomphuis, voordat de deuren opengaan. Donderdag 26 of vrijdag 27 november. Aanmelden via lilou-ede.nl/aanmelden."></canvas>
  <div class="vignette"></div>
  <div class="grain"></div>
  <div class="loader">Lilou</div>
  <div class="controls">
    <button type="button" id="flipBtn">Draai</button>
    <button type="button" id="replayBtn">Opnieuw</button>
  </div>

<script type="module">
import { createStage, printSheet, sheetMaterial, plainPaper, makeCard, rig, runner, THREE } from './3d/engine.js';

const SERIF = '"Cormorant Garamond"', SANS = 'Inter';
const stage = await createStage({
  canvas: document.getElementById('gl'),
  fonts: [`400 80px ${SERIF}`, `500 80px ${SERIF}`, `italic 500 80px ${SERIF}`, `600 40px ${SANS}`, `500 40px ${SANS}`]
});
const { scene, aniso } = stage;

/* ---------- Kaart: 120 x 172 mm, crème katoenpapier, rode letterpress ---------- */
const INK = '#8b2611', DARK = '#3a1a12', LINE = 'rgba(139,38,17,.7)';
const front = printSheet({ wmm: 120, hmm: 172, base: '#f3ece0', seed: 6, draw: p => {
  p.rect(5.2, 5.2, 109.6, 161.6, { color: LINE, width: .22 });
  p.rect(6.8, 6.8, 106.4, 158.4, { color: LINE, width: .22 });
  p.text('O.', 62, 49, { font: SERIF, size: 42, weight: 400, color: INK, depth: 1.6 });
  p.text('Jouw plek aan tafel…', 60, 66, { font: SERIF, size: 10.4, style: 'italic', weight: 500, color: INK, depth: 1.4 });
  p.text('AVANT-', 60, 83, { font: SERIF, size: 16.7, weight: 500, spacing: .02, color: INK, depth: 1.6 });
  p.text('PREMIÈRE', 60, 98.5, { font: SERIF, size: 16.7, weight: 500, spacing: .02, color: INK, depth: 1.6 });
  p.text('26 & 27.11', 60, 112.5, { font: SANS, size: 5.4, weight: 600, spacing: .2, color: DARK, depth: 1.3 });
  p.text('HET EERSTE DINER IN HET POMPHUIS,', 60, 122, { font: SANS, size: 3.3, weight: 500, spacing: .08, color: DARK });
  p.text('VOORDAT DE DEUREN OPENGAAN.', 60, 128.5, { font: SANS, size: 3.3, weight: 500, spacing: .08, color: DARK });
  p.text('LILOU-EDE.NL/AANMELDEN', 60, 151, { font: SANS, size: 3.7, weight: 600, spacing: .14, color: INK });
  p.line(41, 154.5, 79, 154.5, { color: LINE, width: .2 });
}});
const back = printSheet({ wmm: 120, hmm: 172, base: '#f3ece0', seed: 11, draw: p => {
  p.text('O.', 44, 150, { font: SERIF, size: 150, weight: 400, kind: 'blind', depth: .7 });
  p.rect(5.2, 5.2, 109.6, 161.6, { color: LINE, width: .22 });
  p.rect(6.8, 6.8, 106.4, 158.4, { color: LINE, width: .22 });
  p.text('AVANT-PREMIÈRE', 60, 48, { font: SANS, size: 3.1, weight: 600, spacing: .34, color: DARK });
  p.text('Kies je avond…', 60, 64, { font: SERIF, size: 12.5, style: 'italic', weight: 500, color: INK, depth: 1.4 });
  for (const [x, d, n] of [[16, 'DONDERDAG', '26.11'], [63, 'VRIJDAG', '27.11']]) {
    p.rect(x, 74, 41, 28, { color: LINE, width: .22 });
    p.text(d, x + 20.5, 82.5, { font: SANS, size: 2.9, weight: 600, spacing: .2, color: INK });
    p.text(n, x + 20.5, 96, { font: SERIF, size: 12.5, weight: 500, color: INK, depth: 1.4 });
  }
  p.text('HET EERSTE DINER IN HET POMPHUIS,', 60, 114, { font: SANS, size: 3.3, weight: 500, spacing: .08, color: DARK });
  p.text('VOORDAT DE DEUREN OPENGAAN.', 60, 120.5, { font: SANS, size: 3.3, weight: 500, spacing: .08, color: DARK });
  p.text('LILOU-EDE.NL/AANMELDEN', 60, 136, { font: SANS, size: 3.9, weight: 600, spacing: .14, color: INK });
  p.line(40, 139.5, 80, 139.5, { color: LINE, width: .2 });
}});
const card = makeCard(stage, { wmm: 120, hmm: 172, front: sheetMaterial(front, aniso, { envIntensity: .25 }), back: sheetMaterial(back, aniso, { flip: true, envIntensity: .25 }), edge: '#d8ccb9' });
scene.add(card.pivot);

/* ---------- Porseleinen bord ---------- */
const prof = [[0, .0055], [.075, .0055], [.088, .0068], [.098, .0115], [.106, .0158], [.118, .0172], [.13, .0176], [.1365, .017], [.1402, .0154], [.1398, .0138], [.132, .0128], [.112, .0112], [.094, .0058], [.074, .0016], [.072, 0], [.064, 0], [.062, .0012], [0, .0014]].map(([x, y]) => new THREE.Vector2(x, y));
const porcelain = new THREE.MeshPhysicalMaterial({ color: '#d9d1c4', roughness: .24, clearcoat: .8, clearcoatRoughness: .08, envMapIntensity: .45, side: THREE.DoubleSide });
const plate = new THREE.Mesh(new THREE.LatheGeometry(prof, 128), porcelain); plate.castShadow = plate.receiveShadow = true; scene.add(plate);
const ring = new THREE.Mesh(new THREE.RingGeometry(.1235, .1248, 128), new THREE.MeshStandardMaterial({ color: '#8b2611', roughness: .35, polygonOffset: true, polygonOffsetFactor: -2 }));
ring.rotation.x = -Math.PI / 2; ring.position.y = .01755; scene.add(ring);

/* ---------- Servet + bestek ---------- */
const linen = plainPaper({ color: '#e9e0d1', seed: 41, aniso, repeat: 1 });
linen.roughness = .95;
const napkin = new THREE.Mesh(new THREE.BoxGeometry(.12, .004, .23), linen); napkin.position.set(-.215, .002, .01); napkin.rotation.y = .03; napkin.castShadow = napkin.receiveShadow = true; scene.add(napkin);
const steel = new THREE.MeshStandardMaterial({ color: '#e7e4de', metalness: 1, roughness: .16, envMapIntensity: 1.3 });
const shape = pts => new THREE.Shape(pts.map(([x, y]) => new THREE.Vector2(x, y)));
const ext = { depth: .0016, bevelEnabled: true, bevelThickness: .0006, bevelSize: .0005, bevelSegments: 3, curveSegments: 6 };
const fork = new THREE.Mesh(new THREE.ExtrudeGeometry(shape([[-.0065, -.1], [-.0078, -.088], [-.0072, -.02], [-.0032, .036], [-.0045, .05], [-.012, .06], [-.012, .1], [-.0078, .1], [-.0078, .068], [-.0054, .068], [-.0054, .1], [-.0012, .1], [-.0012, .068], [.0012, .068], [.0012, .1], [.0054, .1], [.0054, .068], [.0078, .068], [.0078, .1], [.012, .1], [.012, .06], [.0045, .05], [.0032, .036], [.0072, -.02], [.0078, -.088], [.0065, -.1]]), ext), steel);
fork.rotation.x = -Math.PI / 2; fork.position.set(-.21, .0047, .01); fork.castShadow = fork.receiveShadow = true; scene.add(fork);
const knife = new THREE.Mesh(new THREE.ExtrudeGeometry(shape([[-.006, -.1], [-.007, -.085], [-.0065, -.005], [-.0045, 0], [-.0045, .095], [-.001, .105], [.004, .1], [.0075, .07], [.0075, 0], [.0065, -.005], [.007, -.085], [.006, -.1]]), ext), steel);
knife.rotation.x = -Math.PI / 2; knife.position.set(.172, .0007, .01); knife.castShadow = knife.receiveShadow = true; scene.add(knife);

/* ---------- Wijnglas ---------- */
const gprof = [[0, 0], [.038, 0], [.039, .0015], [.006, .004], [.0035, .012], [.0032, .085], [.006, .095], [.03, .115], [.041, .145], [.039, .18], [.034, .21], [.0335, .21], [.0385, .18], [.0405, .145], [.0295, .116], [.005, .1]].map(([x, y]) => new THREE.Vector2(x, y));
const glassMat = new THREE.MeshPhysicalMaterial({ color: '#ffffff', metalness: 0, roughness: .03, transmission: 1, thickness: .0015, ior: 1.5, envMapIntensity: 1.4, side: THREE.DoubleSide, transparent: true });
const glass = new THREE.Mesh(new THREE.LatheGeometry(gprof, 64), glassMat); glass.position.set(.15, 0, -.2); glass.castShadow = true; scene.add(glass);

/* ---------- Tijdlijn ---------- */
const R = rig(stage);
const C = { x: 0, y: .0167, z: .004, ry: -.035, rz: 0 };
const BASE_Y = .0167;
function topDown() {
  const d = stage.fitDistance(card.w, card.h, stage.STORY ? .9 : .92, stage.STORY ? .7 : .88);
  return { px: C.x, py: d, pz: C.z + d * .012, tx: C.x, ty: BASE_Y, tz: C.z };
}
Object.assign(R.cam, { px: -.07, py: .14, pz: .62, tx: .01, ty: .02, tz: -.06 });
Object.assign(R.light, { x: -.38, y: .58, z: -.5, tx: 0, tz: 0 });
const tl = gsap.timeline({ paused: true, defaults: { ease: 'power2.inOut' } });
tl.to(R.cam, { px: -.03, py: .17, pz: .5, duration: 3.6, ease: 'sine.inOut' }, 0)
  .to(R.cam, { px: 0, py: .42, pz: .3, tz: -.02, duration: 3.2 }, 3.4)
  .to(R.cam, { ...topDown(), duration: 2.6, ease: 'power2.inOut' }, 6.2)
  .to(R.light, { x: -.3, z: -.6, duration: 4, ease: 'sine.inOut' }, 5.5)
  .to(R.light, { x: -.45, z: -.38, duration: 3, ease: 'sine.inOut' }, 9.5);

function flipTo(target, at, t) {
  t.to(C, { rz: target, duration: 1.6, ease: 'power3.inOut' }, at)
   .to(C, { y: BASE_Y + .07, duration: .8, ease: 'power2.out' }, at)
   .to(C, { y: BASE_Y, duration: .8, ease: 'power2.in' }, at + .8);
}

runner(stage, { build: () => ({
  tl,
  apply(t) {
    R.apply(t);
    card.pivot.position.set(C.x, C.y, C.z);
    card.pivot.rotation.set(0, C.ry, C.rz);
  },
  videoTimeline() {
    const m = gsap.timeline({ paused: true });
    m.add(tl.paused(false), 0);
    flipTo(Math.PI, 13.4, m); flipTo(Math.PI * 2, 19, m);
    m.to({}, { duration: .01 }, 23.5);
    return m;
  },
  flip() { const m = gsap.timeline(); flipTo(Math.round(C.rz / Math.PI) * Math.PI + Math.PI, 0, m); },
  reset() { location.reload(); },
  onResize() { Object.assign(R.cam, topDown()); },
  pointer(x, y, done) { if (done) gsap.to(R.light, { x: -.4 + x * .3, z: -.48 + y * .25, duration: 1.2, overwrite: true }); }
}) });
</script>
</body>
</html>
